<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Till: a voice CFO for small businesses</title>
<style>
  :root { --navy:#0f2240; --navy2:#1e3a5f; --accent:#2563eb; --bg:#f8fafc; --surface:#f1f5f9;
          --text:#0f172a; --muted:#475569; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 28px;
           background:var(--navy); color:#fff; }
  header h1 { margin:0; font-size:22px; letter-spacing:.01em; }
  header h1 small { font-weight:400; font-size:15px; color:#cbd5e1; margin-left:10px; }
  .status { font-size:13px; color:#cbd5e1; display:flex; gap:14px; }
  .status b { color:#fff; font-weight:600; }
  main { display:grid; grid-template-columns: minmax(380px, 1fr) minmax(420px, 1.15fr); gap:22px;
         padding:22px 28px; height:calc(100% - 64px); }
  .panel { background:#fff; border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column;
           min-height:0; }
  .panel h2 { margin:0; padding:14px 18px; font-size:13px; letter-spacing:.06em; text-transform:uppercase;
              color:var(--navy2); border-bottom:1px solid var(--line); }
  #convo { flex:1; overflow:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; font-size:15px; }
  .you { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .till { align-self:flex-start; background:var(--surface); border-bottom-left-radius:4px; }
  .trace { align-self:flex-start; font:13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color:var(--muted);
           border-left:3px solid var(--accent); padding:2px 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; padding:12px 18px 0; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px;
          color:var(--navy2); cursor:pointer; }
  .chip:hover { border-color:var(--accent); color:var(--accent); }
  form { display:flex; gap:10px; padding:14px 18px 18px; }
  input { flex:1; font:inherit; padding:11px 14px; border:1px solid var(--line); border-radius:10px; }
  button.mic { width:48px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:20px; cursor:pointer; }
  button.mic.on { background:#b91c1c; }
  button.send { border:0; border-radius:10px; background:var(--navy); color:#fff; padding:0 18px; font:inherit; cursor:pointer; }
  #cards { flex:1; overflow:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
  #cards iframe { flex-shrink:0; width:100%; border:1px solid var(--line); border-radius:12px; background:#fff; height:240px; }
  .hint { color:var(--muted); font-size:14px; }
  .mode { font-size:13px; color:var(--muted); padding:0 18px; }
</style>
</head>
<body>
<header>
  <h1>Till <small>a voice CFO for small businesses</small></h1>
  <div class="status"><span>MCP <b id="proto">connecting…</b></span><span>tools <b id="ntools">0</b></span>
    <span>agent <b id="agent">…</b></span><span>business <b>Sunrise Bakery (demo data)</b></span></div>
</header>
<main>
  <section class="panel">
    <h2>Conversation</h2>
    <div id="convo"><div class="hint">Tap the mic and ask about your cash, or pick a question below.</div></div>
    <div class="chips" id="chips"></div>
    <div class="mode" id="mode"></div>
    <form id="ask">
      <button type="button" class="mic" id="mic" title="Speak">🎙</button>
      <input id="q" placeholder="Ask Till about your money…" autocomplete="off">
      <button class="send">Ask</button>
    </form>
  </section>
  <section class="panel">
    <h2>Cards (MCP Apps, rendered from ui://till/card.html)</h2>
    <div id="cards"></div>
  </section>
</main>
<script>
// ---------------------------------------------------------------- MCP client over Streamable HTTP
const MCP_URL = "/mcp";
const BUSINESS = "demo";
let rpcId = 0, session = null, protocol = null, tools = [], cardHtml = "";

async function rpc(method, params = {}, notify = false) {
  const msg = { jsonrpc: "2.0", method, params };
  if (!notify) msg.id = ++rpcId;
  const headers = { "content-type": "application/json", "accept": "application/json, text/event-stream" };
  if (session) headers["mcp-session-id"] = session;
  if (protocol) headers["mcp-protocol-version"] = protocol;
  const r = await fetch(MCP_URL, { method: "POST", headers, body: JSON.stringify(msg) });
  if (r.headers.get("mcp-session-id")) session = r.headers.get("mcp-session-id");
  if (notify) return null;
  const body = await r.json();
  if (body.error) throw new Error(body.error.message);
  return body.result;
}

async function connect() {
  const init = await rpc("initialize", {
    protocolVersion: "2025-11-25",
    capabilities: { extensions: { "io.modelcontextprotocol/ui": { mimeTypes: ["text/html;profile=mcp-app"] } } },
    clientInfo: { name: "till-voice-demo", version: "0.1.0" },
  });
  protocol = init.protocolVersion;
  await rpc("notifications/initialized", {}, true);
  tools = (await rpc("tools/list")).tools;
  cardHtml = (await rpc("resources/read", { uri: "ui://till/card.html" })).contents[0].text;
  document.getElementById("proto").textContent = protocol;
  document.getElementById("ntools").textContent = tools.length;
}

async function callTool(name, args) {
  const t0 = performance.now();
  const res = await rpc("tools/call", { name, arguments: { business: BUSINESS, ...args } });
  trace(`tools/call ${name}(${JSON.stringify(args)})  ${Math.round(performance.now() - t0)} ms`);
  if (!res.isError) showCard(res);
  return res;
}

// ---------------------------------------------------------------- MCP Apps host (one iframe per result)
function showCard(result) {
  const f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts");
  f.srcdoc = cardHtml;
  const box = document.getElementById("cards");
  box.prepend(f);
  window.addEventListener("message", function onMsg(ev) {
    if (ev.source !== f.contentWindow) return;
    const m = ev.data || {};
    if (m.method === "ui/initialize") {
      f.contentWindow.postMessage({ jsonrpc: "2.0", id: m.id, result: {
        protocolVersion: m.params.protocolVersion, hostInfo: { name: "till-voice-demo", version: "0.1.0" },
        hostCapabilities: {}, hostContext: { theme: "light", displayMode: "inline" } } }, "*");
    } else if (m.method === "ui/notifications/initialized") {
      f.contentWindow.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: result }, "*");
    } else if (m.method === "ui/notifications/size-changed") {
      f.style.height = Math.min(Math.max(m.params.height + 4, 140), 900) + "px";
    }
  });
}

// ---------------------------------------------------------------- conversation + voice
const convo = document.getElementById("convo");
function add(cls, text) {
  const hint = convo.querySelector(".hint"); if (hint) hint.remove();
  const d = document.createElement("div"); d.className = cls; d.textContent = text;
  convo.appendChild(d); convo.scrollTop = convo.scrollHeight; return d;
}
const trace = t => add("trace", t);

let useTTS = false, audio = null;
function stopSpeaking() {
  if (audio) { audio.pause(); audio = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
function browserSpeak(text) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.04;
  speechSynthesis.speak(u);
}
async function speak(text) {
  stopSpeaking();
  if (!useTTS) return browserSpeak(text);
  try {
    const r = await fetch("/agent/tts", { method: "POST", headers: { "content-type": "application/json" },
                                          body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error(r.status);
    audio = new Audio(URL.createObjectURL(await r.blob()));
    await audio.play();
  } catch { browserSpeak(text); }
}

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
const mic = document.getElementById("mic");
if (!Rec) mic.style.display = "none";
mic.onclick = () => {
  const rec = new Rec(); rec.lang = "en-US"; rec.interimResults = false;
  mic.classList.add("on"); stopSpeaking();
  rec.onresult = e => ask(e.results[0][0].transcript);
  rec.onend = () => mic.classList.remove("on");
  rec.start();
};

document.getElementById("ask").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q"); if (q.value.trim()) ask(q.value.trim()); q.value = "";
};

const PAYPAL = new URLSearchParams(location.search).has("paypal");
const CHIPS = PAYPAL
  ? ["How's PayPal looking?", "Any refund or dispute problems?", "Who owes me money?",
     "What will my PayPal balance look like this quarter?", "Are PayPal fees creeping up?",
     "Invoice orders@example.com 200 dollars for a birthday cake"]
  : ["Give me my morning brief", "Any weird charges?", "Mark the flour charge as a dispute",
     "Can I afford a part-time baker at $1,800 a month?", "What changed in spending last month?",
     "Warn me if cash drops under 12 thousand"];
if (PAYPAL) document.addEventListener("DOMContentLoaded", () => {
  const b = [...document.querySelectorAll(".status b")].pop();
  if (b) b.textContent = "Sunrise Bakery on PayPal (sandbox)";
});
for (const c of CHIPS) {
  const b = document.createElement("button"); b.className = "chip"; b.textContent = c; b.onclick = () => ask(c);
  document.getElementById("chips").appendChild(b);
}

let busy = false, useLLM = false;
const history = [];
async function ask(text) {
  if (busy) return; busy = true;
  add("msg you", text);
  try {
    const reply = useLLM ? await agentTurn(text) : await offlineTurn(text);
    add("msg till", reply); speak(reply);
  } catch (err) {
    add("msg till", "Sorry, something went wrong: " + err.message);
  } finally { busy = false; }
}

// ---------------------------------------------------------------- agent: Claude picks and chains tools
const SYSTEM = `You are Till, a voice CFO for a small business owner. You are speaking out loud.
Use the tools for every number; never estimate. You may call several tools in a row when a question needs it
(for example check unusual_charges to get an id before review_charge, or a forecast before advising).
Reply in at most two short spoken sentences, 45 words total, no lists, no markdown. Lead with the one thing that matters most, then offer one follow-up (for example: want me to go through the charges?).
The first text block of each tool result is already written for the ear; reuse it when it answers the question.
Say numbers exactly as the tools state them; never round a baseline or rate differently. Only offer a follow-up that one of your tools can do.
You are not a licensed advisor; do not give tax or investment advice.
For PayPal questions use the paypal_* tools. Money-moving actions (invoices, refunds, settling disputes) always go
through a preview_* tool first; read the preview back and ask the owner to say "confirm". Only call confirm_action
after the owner's latest message says confirm, and pass the exact confirm_token from the preview.`;

async function agentTurn(text) {
  const llmTools = tools.map(t => ({ name: t.name, description: t.description,
    input_schema: { ...t.inputSchema, properties: Object.fromEntries(
      Object.entries(t.inputSchema.properties || {}).filter(([k]) => k !== "business")) ,
      required: (t.inputSchema.required || []).filter(k => k !== "business") } }));
  history.push({ role: "user", content: text });
  let lastSpeech = "";
  for (let step = 0; step < 6; step++) {
    const r = await fetch("/agent/llm", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ system: SYSTEM, messages: history, tools: llmTools }) });
    const msg = await r.json();
    if (!r.ok) throw new Error(msg.error?.message || msg.error || r.status);
    history.push({ role: "assistant", content: msg.content });
    const uses = msg.content.filter(b => b.type === "tool_use");
    if (!uses.length) {
      const text = msg.content.filter(b => b.type === "text").map(b => b.text).join(" ").trim();
      // An empty or cut-off reply falls back to the tool's own sentence, which is written for the ear.
      const complete = text && msg.stop_reason === "end_turn" && /[.?!]["')]?$/.test(text);
      return complete ? text : (lastSpeech || text || "Sorry, I didn't catch that.");
    }
    const results = [];
    for (const u of uses) {
      const res = await callTool(u.name, u.input || {});
      if (!res.isError && res.content[0]) lastSpeech = res.content[0].text;
      results.push({ type: "tool_result", tool_use_id: u.id, is_error: !!res.isError,
                     content: res.content.map(c => ({ type: "text", text: c.text })) });
    }
    history.push({ role: "user", content: results });
  }
  return "I ran out of steps on that one. Try asking a narrower question.";
}

// ---------------------------------------------------------------- offline router (no API key needed)
function dollars(text) {
  const m = text.replace(/,/g, "").match(/\$?\s*(\d+(?:\.\d+)?)\s*(k|thousand)?/i);
  return m ? parseFloat(m[1]) * (m[2] ? 1000 : 1) : null;
}

let lastCharges = [];
let pendingToken = null;
async function offlineTurn(text) {
  const t = text.toLowerCase();
  const first = r => r.content[0].text;
  if (PAYPAL) {
    if (/^\s*(yes,?\s*)?confirm/.test(t)) {
      if (!pendingToken) return "There's nothing waiting for confirmation.";
      const r = await callTool("confirm_action", { confirm_token: pendingToken }); pendingToken = null; return first(r);
    }
    const inv = t.match(/invoice\s+(\S+@\S+)\s+\$?([\d,.]+)\s*(?:dollars)?\s*(?:for\s+(.+))?/);
    if (inv) {
      const r = await callTool("preview_invoice", { recipient_email: inv[1], amount: parseFloat(inv[2].replace(/,/g, "")),
                                                    item: (inv[3] || "your order").replace(/[.?!]$/, "") });
      pendingToken = r.structuredContent?.confirm_token || null; return first(r);
    }
    if (/(refund|dispute|chargeback)/.test(t)) return first(await callTool("paypal_refund_radar", {}));
    if (/(owe|invoice|unpaid|overdue)/.test(t)) return first(await callTool("paypal_unpaid_invoices", {}));
    if (/(fee)/.test(t)) return first(await callTool("paypal_fee_watch", {}));
    if (/(forecast|quarter|next|weeks|look like)/.test(t)) return first(await callTool("paypal_forecast", {}));
    return first(await callTool("paypal_cash_brief", {}));
  }
  if (/(dispute|cancel|expected|that's fine|was fine|mark)/.test(t)) {
    if (!lastCharges.length) lastCharges = (await callTool("unusual_charges", {})).structuredContent.charges;
    const hit = lastCharges.find(c => c.vendor.toLowerCase().split(/\s+/).some(w => w.length > 3 && t.includes(w)))
             || lastCharges[0];
    if (!hit) return "There are no flagged charges to review.";
    const verdict = /cancel/.test(t) ? "cancel" : /dispute/.test(t) ? "dispute" : "expected";
    const r = await callTool("review_charge", { charge_id: hit.id, verdict });
    lastCharges = lastCharges.filter(c => c.id !== hit.id);
    return first(r);
  }
  if (/afford|hire|lease|buy/.test(t)) {
    const amt = dollars(t) || 0;
    const once = /(one.time|up front|upfront|once)/.test(t);
    const item = (t.match(/afford ((?:a |an |the )?[a-z\s-]+?)(?: at| for| \$|\?|$)/) || [])[1] || "it";
    return first(await callTool("can_i_afford", once ? { item, one_time_cost: amt } : { item, monthly_cost: amt }));
  }
  if (/(warn|alert|tell me if|let me know if)/.test(t)) {
    return first(await callTool("set_cash_alert", { threshold: dollars(t) || 5000 }));
  }
  if (/(weird|unusual|odd|strange|charge|duplicate)/.test(t)) {
    const r = await callTool("unusual_charges", {});
    lastCharges = r.structuredContent.charges || [];
    return first(r);
  }
  if (/(forecast|next|weeks|ahead|coming|run out|runway)/.test(t)) return first(await callTool("cash_forecast", { weeks: 13 }));
  if (/(spend|changed|last month|why)/.test(t)) return first(await callTool("spending_change", {}));
  if (/(how much|balance|cash on hand|in the bank)/.test(t)) return first(await callTool("cash_snapshot", {}));
  const r = await callTool("morning_brief", {});
  lastCharges = r.structuredContent.open_charges || [];
  return first(r);
}

// ---------------------------------------------------------------- boot
(async () => {
  try { await connect(); } catch (e) { document.getElementById("proto").textContent = "offline"; return; }
  try {
    const s = await (await fetch("/agent/status")).json();
    useLLM = s.llm && !new URLSearchParams(location.search).has("offline");
    useTTS = s.tts && !new URLSearchParams(location.search).has("browservoice");
    document.getElementById("agent").textContent = useLLM ? s.model : "offline router";
  } catch { document.getElementById("agent").textContent = "offline router"; }
  document.getElementById("mode").textContent = useLLM
    ? "Claude chooses and chains the tools. Every number comes from the MCP server."
    : "No API key set: a built-in keyword router picks the tool. Every number comes from the MCP server.";
})();
</script>
</body>
</html>
